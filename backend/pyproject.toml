[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.ruff.lint.per-file-ignores]
"apps/transactions/management/commands/*.py" = ["E501"]  # embedded SQL
"apps/*/serializers.py" = ["E501"]  # explicit one-line field lists
"graph_engine_lib/*.py" = ["E501"]  # dense finding dictionaries
"duplicates_lib/*.py" = ["E501"]  # dense evidence dictionaries
"apps/duplicates/*.py" = ["E501"]  # dense field/evidence literals
"apps/risk_engine/**/*.py" = ["E501"]  # dense component/assembly code and migrations
"apps/explain/**/*.py" = ["E501"]  # narrative templates and payload assembly
"apps/alerts/**/*.py" = ["E501"]  # rule candidates and queries
"apps/cases/**/*.py" = ["E501"]  # serializers, report tables and migrations
"tests/*.py" = ["E501"]  # long literal CSV/header fixtures

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.development"
