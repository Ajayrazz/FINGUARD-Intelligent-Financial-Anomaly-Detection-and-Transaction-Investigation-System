services:
  db:
    image: postgres:16
    env_file: .env
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 8s
      retries: 12
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
  backend: &backend
    build: {context: ., dockerfile: docker/backend/Dockerfile}
    env_file: .env
    volumes: ["./backend:/app", "./datasets:/datasets"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    ports: ["8000:8000"]
  worker:
    <<: *backend
    command: celery -A config worker -l info
    ports: []
  frontend:
    build: {context: ., dockerfile: docker/frontend/Dockerfile}
    environment:
      VITE_BACKEND_URL: http://backend:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on: [backend]
    ports: ["5173:5173"]
volumes:
  neo4jdata:
  pgdata:
  frontend_node_modules:
