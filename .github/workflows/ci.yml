name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_DB: finguard, POSTGRES_USER: finguard, POSTGRES_PASSWORD: ci-only}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finguard" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      POSTGRES_DB: finguard
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: ci-only
      POSTGRES_HOST: localhost
      REDIS_URL: redis://localhost:6379/0
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      - run: ruff check .
      - run: mypy .
      - run: pytest -q --cov=apps --cov=graph_engine_lib --cov=duplicates_lib --cov=risk_engine_lib --cov=ml_engine --cov=shared --cov-report=term
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test
